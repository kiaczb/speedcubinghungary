# Base stack shared by every environment.
# Always combine with exactly one environment override + its env file:
#
#   dev  : docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml  --env-file .env.dev  up
#   test : docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml --env-file .env.test up -d --build
#   prod : docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# This base file defines structure only — all values come from the --env-file.
# With no build target selected it builds the final (production) image stages;
# docker-compose.dev.yml switches the api/web builds to their `dev` stages.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEPLOYMENT: ${DEPLOYMENT}
      NODE_ENV: ${NODE_ENV}
      FRONTEND_URL: ${FRONTEND_URL}
      WCA_CLIENT_ID: ${WCA_CLIENT_ID}
      WCA_CLIENT_SECRET: ${WCA_CLIENT_SECRET}
      WCA_REDIRECT_URI: ${WCA_REDIRECT_URI}
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
    # No host port published here: in test/prod only Caddy reaches the api over
    # the internal network. The dev override re-publishes it for localhost work.
    networks: [appnet]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV}
      SERVER_API_URL: ${SERVER_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WCA_CLIENT_ID: ${NEXT_PUBLIC_WCA_CLIENT_ID}
      NEXT_PUBLIC_WCA_REDIRECT_URI: ${NEXT_PUBLIC_WCA_REDIRECT_URI}
      NEXT_PUBLIC_BACKEND_LOGIN: ${NEXT_PUBLIC_BACKEND_LOGIN}
    # No host port published here either; Caddy fronts it in test/prod and the
    # dev override re-publishes it for localhost work.
    networks: [appnet]

  # Weekly-report email job. Not part of the always-on stack — it lives behind
  # the `jobs` profile so a normal `up` never starts it. Run it on demand with
  # the same --env-file model as the other services:
  #
  #   docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml \
  #     --env-file .env.test --profile jobs run --rm weekly-report
  #
  # It reads the SHARED db over the internal network (DB_HOST=db) and sends mail
  # to EMAIL_TO — point that at a fixed test inbox outside production. The EMAIL_*
  # vars default to empty so the main stack stays warning-free; the job validates
  # them fail-fast at runtime (config.py) when actually invoked.
  weekly-report:
    build:
      context: ../apps/scripts/weekly-report
      dockerfile: Dockerfile
    profiles: [jobs]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
    restart: "no"
    networks: [appnet]

  # Reverse proxy / automatic HTTPS (Let's Encrypt). Only runs where the
  # `proxy` profile is enabled (test/prod set COMPOSE_PROFILES=proxy in their
  # env file); dev never activates it and keeps using plain http://localhost.
  caddy:
    image: caddy:2-alpine
    profiles: [proxy]
    depends_on:
      - web
      - api
    environment:
      # Defaults keep dev quiet (Caddy isn't started there); test/prod set these.
      # Single domain: the API is path-routed under WEB_DOMAIN/api (see Caddyfile).
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
