services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  api:
    build:
      context: ..
      dockerfile: infra/docker/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEPLOYMENT: ${DEPLOYMENT}
      FRONTEND_URL: ${FRONTEND_URL}
      WCA_CLIENT_ID: ${WCA_CLIENT_ID}
      WCA_CLIENT_SECRET: ${WCA_CLIENT_SECRET}
      WCA_REDIRECT_URI: ${WCA_REDIRECT_URI}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      WCA_LIVE_URL: ${WCA_LIVE_URL:-}
    volumes:
      - uploads_data:/data/uploads
    networks: [appnet]

  web:
    build:
      context: ..
      dockerfile: infra/docker/web/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV}
      SERVER_API_URL: ${SERVER_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    networks: [appnet]

  weekly-report:
    build:
      context: ../apps/scripts/weekly-report
      dockerfile: Dockerfile
    profiles: [jobs]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
    restart: "no"
    networks: [appnet]

  caddy:
    image: caddy:2-alpine
    profiles: [proxy]
    depends_on:
      - web
      - api
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
