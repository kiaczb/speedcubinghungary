# Production overrides: immutable built images, no bind mounts, no hot reload.
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Structurally identical to the test override (same immutable-image deployment);
# the differences between staging and production live entirely in the env files
# (.env.test vs .env.prod): domains, secrets, ports, COMPOSE_PROJECT_NAME.

services:
  db:
    restart: always

  api:
    restart: always

  web:
    build:
      # NEXT_PUBLIC_* must be baked into the browser bundle at build time.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always

  caddy:
    restart: always
