services:
  db:
    ports:
      - "${DB_PORT_HOST:-5432}:5432"

  api:
    build:
      target: dev
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ../apps/api:/app
      - ../db/migrations:/migrations
      - go_mod_cache:/go/pkg/mod

  web:
    build:
      target: dev
    environment:
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  go_mod_cache:
  web_node_modules:
