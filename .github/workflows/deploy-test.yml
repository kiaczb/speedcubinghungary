name: Deploy TEST

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to staging server
    needs: ci
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"

            echo "==> Fetching latest code (test branch)"
            git fetch --prune origin
            git checkout test
            git reset --hard origin/test

            echo "==> Building & starting staging stack"
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml --env-file .env.test up -d --build

            echo "==> Pruning dangling images"
            docker image prune -f

            echo "==> Status"
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml --env-file .env.test ps
