name: Deploy PROD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production server
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"

            echo "==> Fetching latest code (main branch)"
            git fetch --prune origin
            git checkout main
            git reset --hard origin/main

            echo "==> Building & starting production stack"
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build

            echo "==> Pruning dangling images"
            docker image prune -f

            echo "==> Status"
            docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml --env-file .env.prod ps
