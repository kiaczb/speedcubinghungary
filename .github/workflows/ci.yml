name: CI

# Build, lint and test. Runs on develop / feature / hotfix branches and on PRs,
# and is reused by the deploy workflows (workflow_call) so test/prod only deploy
# after CI passes. No deployment happens here.
on:
  push:
    branches: [develop, "feature/**", "hotfix/**"]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend (build, vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  scripts:
    name: Scripts (weekly-report tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scripts/weekly-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/scripts/weekly-report/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
