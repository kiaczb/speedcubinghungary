name: Deploy DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DEV server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          # Visszakapcsoljuk a debugot, hogy lássuk az stdout/stderr kimenetet a szerverről!
          debug: true
          script: |
            echo "==> Milyen felhasznalokent jelentkeztunk be?"
            whoami
            
            echo "==> Honnan indulunk?"
            pwd
            
            echo "==> Probalunk belepni a mappaba (FIX utvonal teszt)..."
            # Szandekosan fixen beirva, hogy kizarjuk a Secret formázási hibajat!
            cd /srv/speedcubinghungary-DEV/speedcubinghungary
            
            echo "==> Sikerult belepni? Jelenlegi mappa:"
            pwd

            echo "==> Fetching latest code (dev branch)"
            git fetch --prune origin
            git checkout dev
            git reset --hard origin/dev

            echo "==> Rebuilding & restarting APP containers"
            docker compose up -d --build api web

            echo "==> Pruning dangling images"
            docker image prune -f

            echo "==> Current container status"
            docker compose ps
