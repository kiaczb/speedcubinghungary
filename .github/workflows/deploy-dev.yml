name: Deploy DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DEV server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          # Visszakapcsoljuk a debugot, hogy lássuk az stdout/stderr kimenetet a szerverről!
          debug: true
          request_pty: true
          script: |
            set -e

            echo "==> Belépés a mappába..."
            cd /srv/speedcubinghungary-DEV/speedcubinghungary
            pwd
            
            echo "==> Fetching latest code (dev branch)"
            git fetch --prune origin
            git checkout dev
            git reset --hard origin/dev

            echo "==> Rebuilding APP containers (építés)..."
            # Kifejezetten külön építjük a dockert, megakadályozva a terminál blokkolását
            docker compose build api web

            echo "==> Restarting APP containers (indítás)..."
            docker compose up -d api web

            echo "==> Pruning dangling images"
            docker image prune -f

            echo "==> Current container status"
            docker compose ps