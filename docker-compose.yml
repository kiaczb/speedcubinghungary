# Base stack shared by every environment.
# Always combine with exactly one environment override + its env file:
#
#   dev  : docker compose -f docker-compose.yml -f docker-compose.dev.yml  --env-file .env.dev  up
#   test : docker compose -f docker-compose.yml -f docker-compose.test.yml --env-file .env.test up -d --build
#   prod : docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# This base file defines structure only — all values come from the --env-file.
# With no build target selected it builds the final (production) image stages;
# docker-compose.dev.yml switches the api/web builds to their `dev` stages.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEPLOYMENT: ${DEPLOYMENT}
      NODE_ENV: ${NODE_ENV}
      FRONTEND_URL: ${FRONTEND_URL}
      WCA_CLIENT_ID: ${WCA_CLIENT_ID}
      WCA_CLIENT_SECRET: ${WCA_CLIENT_SECRET}
      WCA_REDIRECT_URI: ${WCA_REDIRECT_URI}
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${API_PORT:-8080}:8080"
    networks: [appnet]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV}
      SERVER_API_URL: ${SERVER_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WCA_CLIENT_ID: ${NEXT_PUBLIC_WCA_CLIENT_ID}
      NEXT_PUBLIC_WCA_REDIRECT_URI: ${NEXT_PUBLIC_WCA_REDIRECT_URI}
      NEXT_PUBLIC_BACKEND_LOGIN: ${NEXT_PUBLIC_BACKEND_LOGIN}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
