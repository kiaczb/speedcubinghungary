services:
  db:
    image: postgres:18
    env_file:
      - ./db/.env
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: Speedcubing-DEV
      POSTGRES_DB: speedcubinghungary_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d speedcubinghungary_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    env_file:
      - ./apps/api/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./db/migrations:/migrations
      - go_mod_cache:/go/pkg/mod
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    env_file:
      - ./apps/web/.env
    environment:
      - NODE_ENV=development
      - SERVER_API_URL=http://api:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - HOSTNAME=0.0.0.0
      # Polling-based file watching — required for hot reload on Windows/WSL bind mounts
      - WATCHPACK_POLLING=true
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      # Named volume keeps node_modules inside the container, avoids host/container OS conflicts
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"

volumes:
  postgres_data_dev:
  go_mod_cache:
  web_node_modules:
